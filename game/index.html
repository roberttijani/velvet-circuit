<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VELVET CIRCUIT — Tactical Noir Architectural Heist</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #03060C;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #gameContainer {
      position: relative;
      width: 100%;
      max-width: 1280px;
      height: 100%;
      max-height: 480px;
      aspect-ratio: 1280 / 480;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 1px rgba(0, 240, 255, 0.4);
      background-color: #070C16;
    }
    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: auto;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="1280" height="480"></canvas>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
